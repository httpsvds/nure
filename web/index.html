      font: 13px/1.4 -apple-system, "Segoe UI", system-ui, sans-serif;

    /* Shown until the engine paints, then removed by flutter_bootstrap.js.

      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      color: #9aa0ad;
      font-size: 13px;
      letter-spacing: 0.04em;
      background: #F7F2E8;
      z-index: 4;
    }
  </style>
